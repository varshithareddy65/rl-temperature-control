# Single source of truth for plant, environment, reward, PID, PPO and evaluation settings.
plant:
  dt: 1.0                 # s, simulation step
  C: 5000.0               # J/K, thermal capacitance
  R: 0.02                 # K/W, thermal resistance to ambient   (tau = R*C = 100 s)
  P_max: 2000.0           # W, max heater power (u = 1)
  T_safe_max: 80.0        # degC, safety trip limit
  sensor_noise_std: 0.05  # degC, measurement noise

env:
  episode_steps: 400
  target_range: [30.0, 55.0]
  init_temp_range: [15.0, 60.0]
  capacity_scale_range: [0.7, 1.3]   # randomised heater capacity (training only)
  ambient_range: [10.0, 30.0]
  ambient_step_prob: 0.3
  ambient_step_max: 5.0
  max_target_changes: 2
  disturbance_prob: 0.6
  disturbance_max_W: 300.0           # +/- heat gain/loss pulse
  feasibility_margin: 0.7            # targets limited to ambient + 0.7 * max rise

reward:
  w_error: 0.1        # per K of |error|
  w_effort: 0.02      # per unit heater fraction
  w_smooth: 0.02      # per unit change of heater fraction
  safety_penalty: 10.0

obs:
  dT_alpha: 1.0         # 1.0 = raw dT (v1 behaviour). <1 = low-pass filtered dT (noise reduction); needs retraining

pid:                  # filled in by `python pid_controller.py` (grid-search tuning)
  Kp: 0.2
  Ti: 30.0
  Kd: 0.0
  deriv_filter_tau: 5.0

ppo:
  total_timesteps: 300000
  n_envs: 4
  n_steps: 512          # per env -> 2048 samples / update
  batch_size: 64
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
  seed: 0
  model_path: models/ppo_temperature.zip
  monitor_path: logs/monitor.csv

eval:
  settle_band: 0.5      # degC
  ss_window: 50         # last N steps used for steady-state error
  seed: 123
  results_dir: results
